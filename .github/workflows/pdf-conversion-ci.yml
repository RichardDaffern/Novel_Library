name: PDF novel converter (offline)

on:
  pull_request:
    paths:
      - 'tools/pdf_to_novel.py'
      - 'requirements-pdf.txt'
      - 'tests_pdf/**'
      - '.github/workflows/pdf-conversion-ci.yml'
  push:
    branches: [main]
    paths:
      - 'tools/pdf_to_novel.py'
      - 'requirements-pdf.txt'
      - 'tests_pdf/**'
  workflow_dispatch:

jobs:
  offline-pdf-conversion:
    name: PDF conversion / ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline PDF converter dependencies
        run: python -m pip install -r requirements-pdf.txt
      - name: Run synthetic-PDF regression tests without network calls
        run: python -m unittest discover -s tests_pdf -p test_pdf_to_novel.py -v