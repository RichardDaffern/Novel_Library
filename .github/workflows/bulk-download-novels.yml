name: NovelFull - Bulk Download

on:
  workflow_dispatch:
    inputs:
      novel_urls:
        description: 'Novel URLs separated by commas, spaces, or newlines (max 10)'
        required: true
        type: string
      chapter_range:
        description: 'Optional inclusive chapter range for every novel'
        required: false
        type: string
      force:
        description: 'Force new downloads even if existing artifacts are available'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_work: ${{ steps.plan.outputs.has_work }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate URLs, deduplicate and check registry
        id: plan
        env:
          NOVEL_URLS: ${{ inputs.novel_urls }}
          CHAPTER_RANGE: ${{ inputs.chapter_range }}
          FORCE: ${{ inputs.force }}
        run: |
          args=(python -m tools.bulk_download plan --urls "$NOVEL_URLS" --chapter-range "$CHAPTER_RANGE")
          if [[ "$FORCE" == "true" ]]; then args+=(--force); fi
          "${args[@]}"

      - name: Explain skipped novels
        if: steps.plan.outputs.has_work == 'false'
        run: echo "::notice::Every requested novel already has a completed available download. Force can override this."

  download-each-novel:
    needs: prepare
    if: needs.prepare.outputs.has_work == 'true'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/download-novel.yml
    with:
      novel_url: ${{ matrix.novel_url }}
      chapter_range: ${{ matrix.chapter_range }}
      force: ${{ matrix.force }}
    permissions:
      contents: write
      pull-requests: write
      actions: read

  summary:
    needs: [prepare, download-each-novel]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Explain where each completed novel is stored
        env:
          PLAN: ${{ needs.prepare.result }}
          DOWNLOADS: ${{ needs.download-each-novel.result }}
        run: |
          echo "## Bulk novel downloads" >> "$GITHUB_STEP_SUMMARY"
          echo "Plan: $PLAN; child downloads: $DOWNLOADS" >> "$GITHUB_STEP_SUMMARY"
          echo "Each novel runs its own bounded chapter jobs and produces its own downloadable ZIP artifact under this Actions run." >> "$GITHUB_STEP_SUMMARY"
          echo "Successfully assembled novels are added to DOWNLOADED_NOVELS.md by registry-only pull requests." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PLAN" == "failure" || "$DOWNLOADS" == "failure" ]]; then
            echo "::error::At least one novel failed. Other complete novel archives remain available in this workflow run."
            exit 1
          fi
