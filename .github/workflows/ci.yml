name: Test novel library

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Verify inclusive range creates two chapter files
        run: |
          python -u novel_downloader.py --self-test --chapter-range 3-4 --output-dir smoke
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('smoke/fanficfare-smoke-test-chapters-0003-0004')
          rows = json.loads((p/'chapters.json').read_text())
          assert len(rows)==2, f'Expected 2 chapters, got {len(rows)}'
          assert [row['position'] for row in rows]==[3, 4]
          assert all((p/row['file']).stat().st_size>20 for row in rows)
          assert (p/'source.epub').stat().st_size>1000
          print('Two individual TXT files and partial EPUB created')
          PY
      - name: Verify independent batches combine into one EPUB (offline)
        run: |
          python -u -m tools.chunked_download plan --self-test --chapter-range 1-4 --chunk-size 2 --plan-file ci_plan.json
          KEY=$(python -c "from tools.chunked_download import identity,SYNTHETIC_URL;print(identity(SYNTHETIC_URL))")
          python -u -m tools.chunked_download fetch --self-test --key "$KEY" --start 1 --end 2 --output-dir "ci_parts/chapter-batch-${KEY}-00001-00002" --scratch-dir ci_scratch1
          python -u -m tools.chunked_download fetch --self-test --key "$KEY" --start 3 --end 4 --output-dir "ci_parts/chapter-batch-${KEY}-00003-00004" --scratch-dir ci_scratch2
          python -u -m tools.chunked_download assemble --self-test --plan-file ci_plan.json --chunks-dir ci_parts --output-dir ci_combined
          python - <<'PY'
          import json
          from pathlib import Path
          from novel_downloader import epub_chapters
          book = Path('ci_combined/fanficfare-smoke-test')
          rows = json.loads((book / 'chapters.json').read_text())
          assert [r['position'] for r in rows] == [1, 2, 3, 4]
          assert all((book / r['file']).stat().st_size > 30 for r in rows)
          _, chapters = epub_chapters(book / 'source.epub')
          assert len(chapters) == 4
          print('Verified four distinct synthetic TXT chapters and one reassembled EPUB')
          PY
      - name: Check NovelFull chapter discovery (no chapter text downloaded)
        continue-on-error: true
        timeout-minutes: 6
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python -u novel_downloader.py "https://novelfull.com/interstellar-era-starting-as-a-cleaner.html" --confirm-rights --list-only > /tmp/novelfull-metadata.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/novelfull-metadata.json').read_text())
          count = int(data.get('numChapters', 0))
          assert count >= 1, f'Expected at least one chapter link, got {count}'
          print(f'NovelFull adapter chapter discovery succeeded: {count} entries (metadata only)')
          PY
      - name: Upload two-chapter synthetic test output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: two-chapter-smoke-test
          path: smoke/
          retention-days: 3
          if-no-files-found: error

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Validate one-click downloader syntax and launcher path
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/download_all_artifacts.ps1').Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'PowerShell syntax validation failed'
          }
          if (-not (Test-Path 'Download-All-Novels.cmd')) { throw 'Windows launcher is missing' }
          if (-not ((Get-Content 'Download-All-Novels.cmd' -Raw) -like '*tools\download_all_artifacts.ps1*')) { throw 'Launcher does not invoke downloader' }
          # Parse with Windows PowerShell 5.1, the same executable used by the CMD launcher.
          $legacyErrors = $null
          $legacyParser = @'
          $path = (Resolve-Path 'tools/download_all_artifacts.ps1').Path
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host $_.Message }; exit 1 }
          '@
          $legacyParser | powershell.exe -NoProfile -NonInteractive -Command -
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 parse failed' }
          # Simulate a parameter-validation error before contacting GitHub. This
          # catches CMD parentheses bugs that would skip the final pause.
          $output = & cmd.exe /d /c 'echo.|call "Download-All-Novels.cmd" -Limit -1' 2>&1 | Out-String
          if ($output -notmatch 'ERROR: Downloader exited with code') { throw "Launcher hid its error: $output" }
          if ($output -notmatch 'Press any key to close this window') { throw "Launcher did not reach its pause: $output" }
          if ($LASTEXITCODE -eq 0) { throw "The simulated launcher failure unexpectedly exited successfully: $output" }
          # Expected negative test: clear the native command's nonzero code so
          # the pwsh GitHub Actions step itself finishes successfully.
          $global:LASTEXITCODE = 0
          # Positive startup regression: PowerShell 5.1 must bind parameters
          # and resolve the default folder, even when its path has spaces.
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'Novel Library With Spaces'
          $smokeTools = Join-Path $smokeRoot 'tools'
          New-Item -ItemType Directory -Force -Path $smokeTools | Out-Null
          Copy-Item 'tools/download_all_artifacts.ps1' (Join-Path $smokeTools 'download_all_artifacts.ps1')
          $smokeScript = Join-Path $smokeTools 'download_all_artifacts.ps1'
          $startup = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $smokeScript -BrowserLogin -CheckSetup 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 5.1 failed at argument binding/startup: $startup" }
          if ($startup -notmatch 'Startup self-check passed') { throw "Missing startup success message: $startup" }
          if (-not $startup.Contains((Join-Path $smokeRoot 'Downloaded_Novels'))) { throw "Incorrect default download path: $startup" }
          if (-not (Test-Path (Join-Path $smokeRoot 'download-last-run.log'))) { throw "Startup did not create the diagnostic log: $startup" }
          Write-Host 'PowerShell 5.1 and launcher failure path verified (no network requests)'
      - name: Verify chunked EPUB assembly on Windows (offline)
        shell: pwsh
        run: |
          python -m tools.chunked_download plan --self-test --chapter-range 1-4 --chunk-size 2 --plan-file ci_plan_win.json
          $Key = python -c "from tools.chunked_download import identity,SYNTHETIC_URL;print(identity(SYNTHETIC_URL))"
          python -m tools.chunked_download fetch --self-test --key "$Key" --start 1 --end 2 --output-dir "ci_win_parts/chapter-batch-$Key-00001-00002" --scratch-dir ci_win_scratch1
          python -m tools.chunked_download fetch --self-test --key "$Key" --start 3 --end 4 --output-dir "ci_win_parts/chapter-batch-$Key-00003-00004" --scratch-dir ci_win_scratch2
          python -m tools.chunked_download assemble --self-test --plan-file ci_plan_win.json --chunks-dir ci_win_parts --output-dir ci_win_combined
          python -c "import json,pathlib; b=pathlib.Path('ci_win_combined/fanficfare-smoke-test'); assert len(json.loads((b/'chapters.json').read_text()))==4; assert (b/'source.epub').is_file(); print('Windows combined EPUB and TXT verified')"
      - name: Verify 2-chapter range with TXT and EPUB on Windows
        run: |
          python -u novel_downloader.py --self-test --chapter-range 3-4 --output-dir smoke
          python -c "import pathlib,json; p=pathlib.Path('smoke/fanficfare-smoke-test-chapters-0003-0004'); assert len(json.loads((p/'chapters.json').read_text()))==2; print('Windows chapters verified')"
