name: Temporary merged-branch cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-merged-branches-once.yml

permissions:
  contents: write

jobs:
  delete-merged-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete only merged PR branch tips that have not moved
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          deleted=0
          skipped=0
          while read -r expected branch; do
            [[ -n "${branch:-}" ]] || continue
            if ! actual=$(gh api "repos/${REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha'); then
              echo "::warning::Unable to read branch ${branch}, leaving it untouched"
              skipped=$((skipped+1))
              continue
            fi
            if [[ "$actual" != "$expected" ]]; then
              echo "::warning::Branch ${branch} moved after audit; preserving it"
              skipped=$((skipped+1))
              continue
            fi
            gh api -X DELETE "repos/${REPOSITORY}/git/refs/heads/${branch}" >/dev/null
            echo "Deleted: ${branch}"
            deleted=$((deleted+1))
          done <<'MERGED_BRANCHES'
          d89117e16175c47132d5c12497247e1019a690c1 chore/actions-website-first-names
          28ee2e48c18dbd8eb7c130cc26d96fc1ccfbd924 chore/clean-actions-names
          86ef12256e7d54effbebf6f6d3bde1060088aad9 diagnostics/webnovel-http-403
          61139a2e211430c7d9a4af50061f9ed33f3fdf0f feat/freewebnovel-two-chapter-feasibility
          0b6ffbdd05891b66d90f0b9a4bbc48e43222bc76 feat/novel-cover-preservation-and-catalogue-downloads
          565bd27e416be9a39157fae04859ebbd2579bcf2 feat/website-grouped-library-bulk
          ed41395afeac35c1cd8eed1e8143580f9105b3d3 feature/adaptive-six-way-parallel-downloads
          befbd8f26be0c10db05be86a0febae9ee1a83644 feature/bulk-download-novels
          338b0ea6c56642cc88b92a86a4f6f6f3b8b864ca feature/chapter-range-and-checkpoints
          81a9ee9ceb2f41cef54480dd713f4c75d7255ec1 feature/download-registry-pr-automation
          c74c08b3ebf968478a59e29f890bb9b0f3217344 feature/freewebnovel-download-workflows
          0df209ef34042841deb7beb6c18c0489b0c4bbc0 feature/one-click-artifact-downloader
          f39fa06dd34bd014c164d3b25f33af95127389c5 feature/resumable-chunked-long-novels
          a8f4ca6963557ee5a16d2a15d5fae4f7951ec382 feature/webnovel-authorised-two-chapter-export
          0501b75effd3fce6097d5f183c4c0c53c8b281da feature/webnovel-browser-two-chapter-feasibility
          50112c6c6f7ef5e494caeaf5d0d153ed78fff03d feature/webnovel-local-import-v2
          83d7accde79c4dd5a5085f064de83f8c404fbfa5 feature/webnovel-metadata-feasibility
          e342f3ab1a53b36b4cc356683f9e10c3d3dd3dc6 feature/webnovel-offline-saved-page-import
          2277c7051a9673681a3990f98d8291794963663c feature/webnovel-two-chapter-public-probe
          6d87e3fad33acb6d76b32847bfe2eb16a639a583 fix/assembled-novel-title-registry
          ab3fc74732ef4a8407283dd30a94ce393789d7e4 fix/atomic-synopsis-in-place
