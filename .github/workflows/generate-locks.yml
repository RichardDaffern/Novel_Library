name: Generate Python dependency locks (temporary audit tool)
on:
  push:
    branches: [fix/novel-integrity-audit-20261111]
    paths:
      - '.github/workflows/generate-locks.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/novel-integrity-audit-20261111
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Resolve runtime dependency versions
        run: |
          python -m pip install 'pip==26.0' 'pip-tools==7.6.2'
          pip-compile --quiet --output-file requirements.lock requirements.txt
          pip-compile --quiet --output-file requirements-pdf.lock requirements-pdf.txt
      - name: Commit version locks only to the audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock requirements-pdf.lock
          if git diff --cached --quiet; then
            echo "Dependency locks already current."
          else
            git commit -m "build: record resolved Python dependency versions"
            git push origin HEAD:fix/novel-integrity-audit-20261111
          fi
