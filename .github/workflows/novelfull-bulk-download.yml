name: NovelFull - Bulk Download

# A site-specific menu entry; planning and download logic are centralised.
on:
  workflow_dispatch:
    inputs:
      novel_names:
        description: 'Saved novel titles separated by semicolons (up to 10)'
        required: false
        type: string
      novel_urls:
        description: 'Optional new book URLs, separated by commas or spaces'
        required: false
        type: string
      chapter_range:
        description: 'Optional inclusive chapter range (e.g. 1-2); blank for all'
        required: false
        type: string
      force:
        description: 'Redownload even if an available archive exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  download:
    uses: ./.github/workflows/library-bulk-download.yml
    with:
      website: NovelFull
      novel_names: ${{ inputs.novel_names }}
      novel_urls: ${{ inputs.novel_urls }}
      chapter_range: ${{ inputs.chapter_range }}
      force: ${{ inputs.force }}
