name: Scribble Hub - Download

on:
  workflow_dispatch:
    inputs:
      novel_url:
        description: 'Scribble Hub series URL (currently registered: 445037 only)'
        required: true
        type: string
        default: 'https://www.scribblehub.com/series/445037/the-adventurous-gamer-ninja--daichi-hekima/'
      confirm_rights:
        description: 'I confirm that I have permission to archive this work'
        required: true
        type: boolean
        default: false
      force:
        description: 'Redownload even if a completed artefact is still available'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: read

# Same-book requests queue; distinct series can run independently.
concurrency:
  group: scribblehub-crosspost-${{ inputs.novel_url }}
  cancel-in-progress: false
  queue: max

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock

      - name: Confirm permissions and verified author cross-post
        id: source
        env:
          NOVEL_URL: ${{ inputs.novel_url }}
          CONFIRM_RIGHTS: ${{ inputs.confirm_rights }}
        run: |
          python - <<'PY'
          import os
          from tools.verified_crosspost_download import _verified_record

          if os.environ["CONFIRM_RIGHTS"] != "true":
              raise SystemExit("Confirm that you have permission to archive this novel.")
          canonical, series_id, _ = _verified_record(os.environ["NOVEL_URL"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"url={canonical}\nseries_id={series_id}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("## Scribble Hub verified author cross-post\n\n")
              output.write(f"Series ID: {series_id}\n\n")
              output.write("Uses the same author's registered FanFiction.net cross-post through FicHub.\n\n")
              output.write("**Privacy:** Artefacts on a public repository may be accessible to others.\n")
          PY

      - name: Check completed-download registry
        id: registry
        env:
          NOVEL_URL: ${{ steps.source.outputs.url }}
          FORCE: ${{ inputs.force }}
        run: |
          args=(python -m tools.download_registry check --url "$NOVEL_URL")
          if [[ "$FORCE" == "true" ]]; then args+=(--force); fi
          "${args[@]}"

      - name: Already downloaded
        if: steps.registry.outputs.skip == 'true'
        run: |
          echo "::notice::A complete unexpired artefact is already recorded; select Force to redownload."
          echo "The requested novel already has an unexpired completed artefact." >> "$GITHUB_STEP_SUMMARY"

      - name: Download and verify author cross-post
        id: download
        if: steps.registry.outputs.skip != 'true'
        env:
          NOVEL_URL: ${{ steps.source.outputs.url }}
          PYTHONUNBUFFERED: '1'
        timeout-minutes: 15
        run: |
          python -u -m tools.verified_crosspost_download "$NOVEL_URL" \
            --confirm-rights --output-dir downloaded_zip

      - name: Explain FicHub export failure
        if: ${{ failure() && steps.download.conclusion == 'failure' }}
        run: |
          echo "::error::The author cross-post export failed. Inspect the FicHub error code above."
          echo "### Download failed before publishing any novel" >> "$GITHUB_STEP_SUMMARY"
          echo "FicHub may be temporarily unavailable. Check the error code in the download step." >> "$GITHUB_STEP_SUMMARY"
          echo "If err=-7, the provider has restricted exports: do not retry or bypass it." >> "$GITHUB_STEP_SUMMARY"
          echo "For other failures, wait before trying again; the workflow never publishes partial archives." >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare standard novel artefact folder
        if: steps.registry.outputs.skip != 'true'
        env:
          NOVEL_URL: ${{ steps.source.outputs.url }}
        run: |
          python -u -m tools.verified_crosspost_artifact \
            --archive-dir downloaded_zip \
            --source-url "$NOVEL_URL" \
            --output-dir downloads

      - name: Upload complete verified novel
        if: steps.registry.outputs.skip != 'true'
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: novel-${{ github.run_id }}-scribblehub-${{ steps.source.outputs.series_id }}
          path: downloads/
          retention-days: 7
          if-no-files-found: error
          compression-level: 6

      - name: Update metadata-only download registry
        if: steps.registry.outputs.skip != 'true'
        env:
          NOVEL_URL: ${{ steps.source.outputs.url }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -u -m tools.publish_registry \
            --url "$NOVEL_URL" \
            --run-id "$GITHUB_RUN_ID" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-url "$ARTIFACT_URL" \
            --downloads-dir downloads
