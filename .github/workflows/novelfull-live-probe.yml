name: Validate two live NovelFull chapters (no text saved)
on:
  push:
    branches:
      - test/novelfull-two-live-chapters
permissions:
  contents: read
jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parsing and site-adapter dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch two NovelFull chapters into memory; verify text and discard it
        timeout-minutes: 9
        env:
          PYTHONUNBUFFERED: '1'
        run: python -u tools/probe_novelfull.py
