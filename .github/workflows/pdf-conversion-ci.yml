name: PDF novel converter (offline)

on:
  pull_request:
    paths:
      - 'tools/pdf_to_novel.py'
      - 'tools/pdf_batch.py'
      - 'requirements-pdf.txt'
      - 'requirements-pdf.lock'
      - 'tests_pdf/**'
      - 'PDF-to-Novel/**'
      - '.github/workflows/pdf-conversion-ci.yml'
  push:
    branches: [main]
    paths:
      - 'tools/pdf_to_novel.py'
      - 'tools/pdf_batch.py'
      - 'requirements-pdf.txt'
      - 'requirements-pdf.lock'
      - 'tests_pdf/**'
      - 'PDF-to-Novel/**'
  workflow_dispatch:

jobs:
  offline-pdf-conversion:
    name: PDF conversion / ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install offline PDF converter dependencies
        run: python -m pip install -r requirements-pdf.lock
      - name: Run synthetic-PDF and batch regression tests (includes CMD on Windows)
        run: python -m unittest discover -s tests_pdf -p test_pdf_*.py -v