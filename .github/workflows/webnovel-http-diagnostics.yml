name: WebNovel HTTP status diagnostics

on:
  push:
    branches:
      - diagnostics/webnovel-http-403
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-public-book:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependency
        run: python -m pip install "beautifulsoup4>=4.12,<5"
      - name: Run offline diagnostic tests
        run: python -m unittest discover -s tests -p 'test_webnovel_http_diagnostics.py' -v
      - name: Diagnose one public book page request
        run: python -m tools.webnovel_http_diagnostics "https://www.webnovel.com/book/33422293300201205"
