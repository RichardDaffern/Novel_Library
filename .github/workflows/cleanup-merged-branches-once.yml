          1f5f90f7b7ddc529a4d94ebc900c98ccceea44b2 fix/link-novel-titles-in-index
          7c05f04e3501a370934f96dda937bbd7073fc28b fix/preserve-epub-synopsis
          e2cfb4341aa1d53e3dc75892f3408fd08cc8865b fix/reject-legacy-novelfull-synopsis-cache
          f7f4d18d46afccf9006a2626d3d77929e648386b fix/skip-existing-local-novel-zips
          ac9a2ac7f031d843dbf090443849b105503c50f6 fix/webnovel-browser-challenge-signals
          d92296c32823e082032dee01f36452fcedb1d5a9 fix/webnovel-browser-table-of-contents-discovery
          b8af2de6f6d2062eb9a14cb2e3b227c5f7b6248f fix/webnovel-saved-html-false-lock
          b55137a534a31d4cb2b261b8634a4d2649b5b38c fix/windows-downloader-error-reporting
          3ad9f2017e9611d1833210a36305a7efe291aa96 fix/windows-powershell-destination-parameter
          3fdf9e43d285ae4eb7d6b5a8918c5117ce64e23a fix/zip-per-novel-and-abe-artifact
          a02e3aa059f36125a21dfa342f8cb1a88efd055d registry/bulk-42393126629
          MERGED_BRANCHES
          echo "Deleted ${deleted}; skipped ${skipped}" | tee -a "$GITHUB_STEP_SUMMARY"
          if (( skipped != 0 )); then exit 1; fi
