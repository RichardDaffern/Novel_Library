name: Temporary live NovelFull cover probe

on:
  push:
    branches: [fix/novelfull-cover-markup]
    paths:
      - .github/workflows/cover-live-probe-once.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Retrieve one public NovelFull cover image only
        run: |
          python - <<'PY'
          from tools.novel_covers import download_site_cover
          url = 'https://novelfull.com/martial-world.html'
          cover, suffix, source = download_site_cover(url)
          assert len(cover) > 100
          print(f'PASS: {len(cover)} bytes, type {suffix}, source {source}')
          PY
